<!-- Signal prompt — shown on personal mobile view when timer expires -->
{% if is_personal and attendee and my_match and my_match_id and state.round_number > 0 %}
<div class="bg-card border border-border-card rounded-xl p-6 text-center" id="signal-prompt-inner">
  <div class="text-[13px] text-t-muted font-semibold uppercase tracking-[0.08em]">
    Round {{ state.round_number }} Complete
  </div>
  <div class="text-base text-t-secondary mt-4">You were matched with</div>
  <div class="text-2xl font-bold mt-2">{{ my_match }}</div>
  <div class="bg-base border border-border-card rounded-[10px] p-5 mt-6">
    <div class="text-[15px] font-semibold mb-4">&#129309; Want to follow up?</div>
    <div class="flex gap-3 justify-center">
      <button
        onclick="sendSignal({{ attendee.id|tojson }}, {{ my_match_id|tojson }}, {{ state.round_number }}, {{ my_match|tojson }})"
        class="bg-action text-action-text border-none rounded-[10px] py-3.5 px-9 text-base font-bold cursor-pointer">
        Yes
      </button>
      <button
        onclick="document.getElementById('signal-prompt').classList.add('hidden')"
        class="bg-subtle text-t-secondary border border-border-subtle rounded-[10px] py-3.5 px-9 text-base font-semibold cursor-pointer">
        Skip
      </button>
    </div>
  </div>
</div>
{% endif %}
